server {
    listen 443 ssl http2;
    server_name infiniteboard.zchtech.ai;

    # SSL证书配置（需要根据实际路径调整）
    ssl_certificate /etc/letsencrypt/live/infiniteboard.zchtech.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infiniteboard.zchtech.ai/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend proxy - Next.js on port 20101
    location / {
        proxy_pass http://127.0.0.1:20101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Backend API proxy - Express on port 20100
    location /api/ {
        proxy_pass http://127.0.0.1:20100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Socket.IO proxy for WebSocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:20100/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Hocuspocus WebSocket proxy
    location /collab {
        proxy_pass http://127.0.0.1:20102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:20100/health;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name infiniteboard.zchtech.ai;
    return 301 https://$server_name$request_uri;
}