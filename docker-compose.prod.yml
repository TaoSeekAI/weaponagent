version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vibe-kanban-frontend
    ports:
      - "20101:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=http://localhost:20100
      - NEXT_PUBLIC_SYNC_URL=http://localhost:20100
      - NEXT_PUBLIC_COLLAB_WS_URL=ws://localhost:20102
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vibe-network

  # Backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vibe-kanban-backend
    ports:
      - "20100:3001"
      - "20102:3002"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://frontend:3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vibe-network

  # All-in-one service (alternative)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe-kanban-app
    ports:
      - "20201:3000"
      - "20200:3001"
      - "20202:3002"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
      - NEXT_PUBLIC_SYNC_URL=http://localhost:3001
      - NEXT_PUBLIC_COLLAB_WS_URL=ws://localhost:3002
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vibe-network
    profiles: ["all-in-one"]

volumes:
  data:
    driver: local

networks:
  vibe-network:
    driver: bridge
    name: vibe-kanban-network